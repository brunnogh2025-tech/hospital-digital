<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cad.css">
</head>
<body>
    <main>
        <div id="opt"><p class="opt">PACIENTE</p><p class="opt">MÉDICO</p></div>
        <form action="#">
            <div><label for="idnome">Nome:</label><input type="text" name="nome" id="idnome" required></div>
            <div><label for="iddata">Data de nascimento:</label><input type="date" name="dataNasc" id="iddata" required></div>
            <div><label for="idemail">Email:</label><input type="email" name="email" id="idemail" required></div>
            <div><label for="idsenha">Senha:</label><input type="password" name="senha" id="idsenha" required></div>
        </form>
    </main>
</body>
</html>
